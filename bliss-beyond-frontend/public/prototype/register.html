<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account | Bliss &amp; Beyond</title>
<meta name="description" content="Create a Bliss & Beyond account to plan and book your event.">
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Karla:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/prototype/assets/css/style.css" rel="stylesheet">
<style>
  .register-password-strength{background:#fffdf8;border:1px solid #e8dfd0;border-radius:12px;padding:.75rem .85rem}
  .register-password-strength__label{color:#8e6726;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  .register-password-meter{background:#eee7db;border-radius:999px;height:6px;overflow:hidden}
  .register-password-meter__fill{background:#b58a3a;border-radius:inherit;display:block;height:100%;transition:width .18s ease,background-color .18s ease;width:0}
  .register-password-strength[data-strength="strong"] .register-password-meter__fill{background:#3b7958}
  .register-password-strength[data-strength="good"] .register-password-meter__fill{background:#8d9b46}
  .register-password-strength[data-strength="fair"] .register-password-meter__fill{background:#b58a3a}
  .register-password-strength[data-strength="weak"] .register-password-meter__fill{background:#a96650}
  .register-password-strength__value{color:#214c3b;font-weight:700}
  .register-password-strength__helper{color:#68746c;font-size:.78rem;line-height:1.4}
  .register-password-strength__success{color:#3b7958;font-size:.78rem;font-weight:600}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-visual" style="background-image:url('/prototype/assets/img/venue-1.jpg')"></div>
  <div class="auth-form"><div class="w-100" style="max-width:420px">
    <a class="d-inline-block mb-4 small" href="/prototype/index.html"><i class="bi bi-arrow-left me-1"></i>Back to site</a>
    <h1 class="h2 mb-1">Create your account</h1>
    <p class="text-ink-soft small mb-4">Save packages, request quotations and track your event in one place.</p>

    <form class="row g-3" data-auth-form="register" data-auth-success="/prototype/customer/dashboard.html">
      <div class="col-md-6">
        <label class="form-label" for="registerFirstName">First name</label>
        <input id="registerFirstName" name="firstName" class="form-control" autocomplete="given-name" required>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="registerLastName">Last name</label>
        <input id="registerLastName" name="lastName" class="form-control" autocomplete="family-name" required>
      </div>
      <div class="col-12">
        <label class="form-label" for="registerEmail">Email</label>
        <input id="registerEmail" name="email" class="form-control" type="email" autocomplete="email" required>
      </div>
      <div class="col-12">
        <label class="form-label" for="registerPhone">Phone</label>
        <input id="registerPhone" name="phone" class="form-control" type="tel" autocomplete="tel" required>
      </div>
      <div class="col-12">
        <label class="form-label" for="registerPassword">Password</label>
        <input id="registerPassword" name="password" class="form-control" type="password" autocomplete="new-password" required>
        <div class="mt-2 register-password-strength" data-password-help data-strength="weak">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="register-password-strength__label">Password strength</span>
            <span class="register-password-strength__value" data-password-strength>Weak</span>
          </div>
          <div class="register-password-meter" role="progressbar" aria-label="Password strength" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span class="register-password-meter__fill" data-password-meter-fill></span>
          </div>
          <div class="register-password-strength__helper mt-2">Use 8+ characters with uppercase, lowercase, number and symbol.</div>
          <div class="register-password-strength__success d-none mt-2" data-password-success>✓ Password meets all requirements</div>
        </div>
      </div>
      <div class="col-12">
        <label class="form-label" for="registerConfirmPassword">Confirm password</label>
        <input id="registerConfirmPassword" name="confirmPassword" class="form-control" type="password" autocomplete="new-password" required>
      </div>
      <div class="col-12 d-flex justify-content-between align-items-center">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="registerTerms" name="terms" required>
          <label class="form-check-label small" for="registerTerms">I agree to the terms of service</label>
        </div>
      </div>
      <div class="col-12">
        <button class="btn btn-gold w-100" type="submit" data-auth-submit>Create account</button>
      </div>
      <div class="col-12 alert d-none" data-auth-status role="alert" aria-live="polite"></div>
    </form>
    <p class="small text-center mt-4 mb-0">Already have an account? <a href="/prototype/login.html">Sign in</a></p>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/prototype/assets/js/main.js"></script>

</body>
</html>
