<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Bliss &amp; Beyond</title>
<meta name="description" content="Sign in to your Bliss & Beyond customer portal.">
<link rel="icon" href="/prototype/../favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Karla:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/prototype/assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-visual" style="background-image:url('/prototype/assets/img/hero.jpg')"></div>
  <div class="auth-form"><div class="w-100" style="max-width:420px">
    <a class="d-inline-block mb-4 small" href="/prototype/index.html"><i class="bi bi-arrow-left me-1"></i>Back to site</a>
    <h1 class="h2 mb-1">Welcome back</h1>
    <p class="text-ink-soft small mb-4">Sign in to manage bookings, quotations and consultations.</p>

    <form class="row g-3" data-auth-form="login" data-auth-success="/prototype/customer/dashboard.html">
      <div class="col-12">
        <label class="form-label" for="loginEmail">Email</label>
        <input id="loginEmail" name="email" class="form-control" type="email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="col-12">
        <label class="form-label" for="loginPassword">Password</label>
        <input id="loginPassword" name="password" class="form-control" type="password" placeholder="Enter your password" autocomplete="current-password" required>
      </div>

      <div class="col-12 d-flex justify-content-between align-items-center">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="loginRemember" name="remember" checked>
          <label class="form-check-label small" for="loginRemember">Remember me</label>
        </div>
        <a class="small" href="/prototype/forgot-password.html">Forgot password?</a>
      </div>
      <div class="col-12">
        <button class="btn btn-gold w-100" type="submit" data-auth-submit>Sign in</button>
      </div>
      <div class="col-12 alert d-none" data-auth-status role="alert" aria-live="polite"></div>
    </form>
    <div class="d-flex align-items-center gap-2 my-4"><hr class="flex-grow-1"><span class="small text-ink-soft">or</span><hr class="flex-grow-1"></div>
    <div class="d-grid gap-2">
      <button class="btn btn-outline-forest" type="button" data-google-signin><i class="bi bi-google me-2"></i>Continue with Google</button>
    </div>
    <p class="small text-center mt-4 mb-0">New here? <a href="/prototype/register.html">Create an account</a></p>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="/prototype/assets/js/main.js"></script>

</body>
</html>
