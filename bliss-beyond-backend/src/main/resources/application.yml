spring:
  application:
    name: bliss-beyond-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bliss_beyond_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:NewPassword123!}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
    show-sql: ${JPA_SHOW_SQL:false}

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:db/create_venues_table.sql

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:${SERVER_PORT:8081}}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:3000,http://127.0.0.1:8080,http://localhost:8082,http://127.0.0.1:8082}

  security:
    jwt-secret: ${JWT_SECRET:change-me-in-env}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
