spring:
  application:
    name: bliss-beyond-backend
  profiles:
    default: local

  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
    show-sql: ${JPA_SHOW_SQL:false}

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:db/create_venues_table.sql

  jackson:
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: ${PORT:${SERVER_PORT:8081}}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:3000,http://127.0.0.1:8080,http://localhost:8082,http://127.0.0.1:8082}

  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

  admin:
    email: ${APP_DEV_ADMIN_EMAIL:blissbeyond01@gmail.com}

  google:
    client-id: ${GOOGLE_CLIENT_ID:}

  mail:
    from: ${MAIL_FROM:blissbeyond01@gmail.com}
