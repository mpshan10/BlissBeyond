spring:
  config:
    import: optional:file:./config/application-local-secret.yml

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/bliss_beyond_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Yangon}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

management:
  health:
    mail:
      enabled: false

server:
  port: ${PORT:${SERVER_PORT:8081}}

app:
  uploads:
    root: ${APP_UPLOAD_ROOT:${user.dir}/uploads}
  security:
    # Spring's random values are used only when local JWT_SECRET is absent.
    jwt-secret: ${JWT_SECRET:${random.uuid}${random.uuid}}
